name: Pipeline da equipe
on:
  push:
    branches: [main]
 pull_request:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: &quot;3.12&quot;
      - run: pip install pytest
      - run: pytest
